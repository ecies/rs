[package]
name = "ecies"
version = "0.3.0"
# docs
authors = ["Weiliang Li <to.be.impressive@gmail.com>"]
description = "Elliptic Curve Integrated Encryption Scheme for secp256k1"
edition = "2024"
rust-version = "1.87"
keywords = [ # at most five
  "secp256k1",
  "x25519",
  "ed25519",
  "ecies",
  "cryptography",
]
license = "MIT"
readme = "README.md"
# links
documentation = "https://docs.rs/ecies/latest/ecies/"
homepage = "https://ecies.org/rs/"
repository = "https://github.com/ecies/rs"

[dependencies]
# elliptic curves
k256 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "critical-section",
] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = [
  "precomputed-tables",
], optional = true }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
], optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true } # msrv 1.85
# compares ed25519 secret keys in constant time
subtle = { version = "2.6.1", default-features = false, optional = true }

# symmetric ciphers
# aes (openssl)
openssl = { version = "0.10.81", default-features = false, optional = true } # msrv 1.80
# aes (pure Rust), always compiled
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes"] }
# xchacha20, always compiled
chacha20poly1305 = { version = "0.11.0", default-features = false }

# hash
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

# random number generator
crypto-common = { version = "0.2.2", default-features = false, features = [
  "rand_core",
] }
getrandom = { version = "0.4.3", default-features = false, features = [
  "sys_rng",
] }
rand_core = { version = "0.10.1", default-features = false }

# configuration
once_cell = { version = "1.21.4", default-features = false, features = [
  "critical-section",
] }
lock_api = "0.4.14"
parking_lot = { version = "0.12.5", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os="unknown"))'.dependencies]
# only for js (browser or node). if it's not js, like substrate, it won't build
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
once_cell = { version = "1.21.4", default-features = false, features = ["std"] }
wasm-bindgen = { version = "0.2.126", default-features = false }

[target.'cfg(all(target_arch = "wasm32", not(target_os="unknown")))'.dependencies]
# for wasm32-wasip2
once_cell = { version = "1.21.4", default-features = false, features = ["std"] }

[features]
default = ["aes-openssl"]
std = ["once_cell/std", "dep:parking_lot"]

# curves
# no usage, TODO: make optional from 0.3.0: secp256k1 = ["dep:k256"]
secp256k1 = []
# the `ecies::x25519` and `ecies::ed25519` modules
curve25519 = ["dep:curve25519-dalek", "dep:x25519-dalek", "dep:ed25519-dalek", "dep:subtle"]
# pick the curve `encrypt` and `decrypt` use, until `Config` does
x25519 = ["curve25519"]
ed25519 = ["curve25519"]

# zeroize
zeroize = ["x25519-dalek?/zeroize", "ed25519-dalek?/zeroize"]

# aes
aes-openssl = ["dep:openssl"]
# no-op: pure Rust AES is always compiled, and used unless aes-openssl is on
aes-rust = []
# 12 bytes nonce, default: 16 bytes
aes-short-nonce = []

# deprecated aes features, TODO: remove from 0.3.0 (aes-12bytes-nonce becomes a tombstone, #178)
openssl = ["aes-openssl"]
pure = ["aes-rust"]
aes-12bytes-nonce = ["aes-short-nonce"]

# xchacha20: selects XChaCha20-Poly1305 instead of AES-256-GCM
xchacha20 = []

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.76"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = [
  "default-tls",
  "form",
] }
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
] }

[[bench]]
harness = false
name = "simple"
path = "bench/simple.rs"
