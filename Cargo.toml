[package]
name = "ecies"
version = "0.3.0"
# docs
authors = ["Weiliang Li <to.be.impressive@gmail.com>"]
description = "Elliptic Curve Integrated Encryption Scheme for secp256k1"
edition = "2024"
rust-version = "1.87"
keywords = [ # at most five
  "secp256k1",
  "x25519",
  "ed25519",
  "ecies",
  "cryptography",
]
license = "MIT"
readme = "README.md"
# links
documentation = "https://docs.rs/ecies/latest/ecies/"
homepage = "https://ecies.org/rs/"
repository = "https://github.com/ecies/rs"

# every curve and backend. `all-features` would enable the tombstones, which fail the build
[package.metadata.docs.rs]
features = ["curve25519", "aes-openssl"]

[dependencies]
# elliptic curves
k256 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
], optional = true }
curve25519-dalek = { version = "5.0.0", default-features = false, features = [
  "precomputed-tables",
], optional = true }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
], optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true } # msrv 1.85
# compares curve25519 secret keys in constant time
subtle = { version = "2.6.1", default-features = false, optional = true }
# clears ed25519 secret keys on drop, and the symmetric key `encapsulate` and `decapsulate` return as `Zeroizing`,
# which makes zeroize 1 a public dependency. k256 and x25519-dalek keys clear themselves, and both pull it in too
zeroize = { version = "1.9.1", default-features = false }

# symmetric ciphers
# aes (openssl)
openssl = { version = "0.10.81", default-features = false, optional = true } # msrv 1.80
# aes (pure Rust), always compiled. `zeroize` makes it clear its copy of the key on drop
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "zeroize"] }
# xchacha20, always compiled. `zeroize` makes it clear its copy of the key on drop
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }

# hash
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

# random number generator
crypto-common = { version = "0.2.2", default-features = false, features = [
  "rand_core",
] }
getrandom = { version = "0.4.3", default-features = false, features = [
  "sys_rng",
] }
rand_core = { version = "0.10.1", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os="unknown"))'.dependencies]
# only for js (browser or node). if it's not js, like substrate, it won't build
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
wasm-bindgen = { version = "0.2.126", default-features = false }

[features]
# Features only compile code in. The wire format is in `Config`
default = ["secp256k1"]
# the `ecies::secp256k1` module, `EllipticCurve::Secp256k1`, `Config::DEFAULT`, `encrypt` and `decrypt`
secp256k1 = ["dep:k256"]
# the `ecies::x25519` and `ecies::ed25519` modules, `EllipticCurve::X25519` and `EllipticCurve::Ed25519`
curve25519 = [
  "dep:curve25519-dalek",
  "dep:x25519-dalek",
  "dep:ed25519-dalek",
  "dep:subtle",
  "x25519-dalek/zeroize",
  "ed25519-dalek/zeroize",
]
# runs AES-256-GCM on OpenSSL instead of pure Rust
aes-openssl = ["dep:openssl"]
# k256's precomputed basepoint table, which needs `std`
std = ["k256?/std", "k256?/precomputed-tables"]

# no-ops, removed in 0.4: pure Rust AES is always compiled, and the dalek keys always zeroize
aes-rust = []
zeroize = []

# tombstones, removed in 0.4: each fails the build with the `Config` field that replaced it
x25519 = []
ed25519 = []
xchacha20 = []
aes-short-nonce = []
aes-12bytes-nonce = []

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.76"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = [
  "default-tls",
  "form",
] }
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
] }

[[bench]]
harness = false
name = "simple"
path = "bench/simple.rs"
required-features = ["secp256k1"]
