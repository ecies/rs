name: CI

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          target: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-hack

      - run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # vcpkg builds OpenSSL from source, so cache its binary archives per runner image, which pins the compiler and ports
      - name: Get vcpkg cache key on Windows
        run: echo "VCPKG_CACHE_KEY=vcpkg-openssl-$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        if: matrix.os == 'windows-latest'

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ env.VCPKG_CACHE_KEY }}
        if: matrix.os == 'windows-latest'

      - name: Install OpenSSL on Windows
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md
        if: matrix.os == 'windows-latest'

      - name: Format
        run: cargo fmt --check
      - name: Check and run lint
        run: sh ./scripts/check-all.sh
      # the features docs.rs builds with, from Cargo.toml's [package.metadata.docs.rs]
      - name: Check doc
        run: cargo doc --no-deps --features curve25519,aes-openssl

      # wasm-bindgen-test-runner must match the locked wasm-bindgen exactly; versions missing from install-action's manifest fall back to cargo-binstall
      - name: Get wasm-bindgen version
        run: echo "WASM_BINDGEN_VERSION=$(cargo pkgid wasm-bindgen | cut -d@ -f2)" >> "$GITHUB_ENV"
        shell: bash

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}

      - name: Test
        run: sh ./scripts/test-all.sh

      # messages over 2 GiB need about 4 GB of memory and are too slow in debug builds, so these tests are ignored there.
      # The limit they check is OpenSSL's (#174), and pure Rust is the default backend, so enable aes-openssl
      - name: Test large messages (release)
        run: cargo test --release --features aes-openssl --test large_messages
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      - name: Coverage
        run: sh ./scripts/cov-all.sh
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        with:
          files: .lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check cargo package
        run: cargo publish --dry-run
        if: matrix.os == 'ubuntu-latest'

  check-msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0 # msrv

      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features aes-openssl
        if: matrix.os != 'windows-latest'
      - run: cargo build
      - run: cargo build --features curve25519,std
      - run: cargo build --no-default-features --features curve25519

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-semver-checks

      # Check public API compatibility against the latest release on crates.io. Until 0.3.0 is there, that is 0.2.16,
      # which has no `curve25519` feature, so only the current version enables it. Once 0.3.0 is out, move
      # `curve25519` into `--features`
      - name: Check semver compatibility
        run: cargo semver-checks --only-explicit-features --features secp256k1,aes-openssl,std --current-features curve25519
