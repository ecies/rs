name: CD

on:
  release:
    # a full release, or a pre-release promoted to one. `published` would skip the promotion
    types: [released]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token lets crates-io-auth-action trade a GitHub OIDC token for a crates.io token that lasts
    # 30 minutes and is revoked when the job ends
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # Trusted Publishing: crates.io trusts this repository's cd.yml, so no stored token is needed
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish cargo package
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
